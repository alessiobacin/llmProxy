openapi: 3.0.3
info:
  title: llmProxy API
  version: 0.3.122
  description: |
    Deterministic LLM transport tool (architecture v11, tool #45).

    Two control planes:
    - Standalone: default mode, configured and operated via the `llmproxy` CLI plus the local REST control plane.
      HierarchyContext is optional. `/v1/messages` is used directly by Claude Code.
    - Platform: opt-in compatibility mode, configured and operated via this HTTP API. HierarchyContext is required
      on platform endpoints. Metering records are emitted via the configured sink.

    llmProxy never runs LLM-driven logic. It transports requests, manages provider
    fallback, and produces deterministic audit and metering records.
servers:
  - url: http://127.0.0.1:5045
    description: Local standalone proxy (development)
  - url: http://127.0.0.1:6045
    description: Local standalone proxy (staging)
  - url: http://127.0.0.1:7045
    description: Local standalone proxy (production)
  - url: https://llmproxy.platform.local
    description: Platform deployment
tags:
  - name: runtime
    description: LLM transport runtime endpoints.
  - name: platform
    description: Platform-facing endpoints. Require HierarchyContext.
  - name: control-plane
    description: CLI-over-REST wrappers retained for backward compatibility.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    HierarchyContextHeader:
      in: header
      name: X-Hierarchy-Context
      required: false
      schema:
        type: string
        description: JSON-encoded HierarchyContext. Required in platform mode.
    MeteringContextHeader:
      in: header
      name: X-Metering-Context
      required: false
      schema:
        type: string
        description: JSON-encoded MeteringContext.
    TraceIdHeader:
      in: header
      name: X-Trace-Id
      required: false
      schema:
        type: string
  schemas:
    OpenAIErrorResponse:
      type: object
      description: OpenAI-style error envelope used by /v1/chat/completions and /v1/llm/chat/completions (never the Anthropic-style {type:error} envelope).
      properties:
        error:
          type: object
          properties:
            message: {type: string}
            type: {type: string, description: e.g. authentication_error, invalid_request_error, api_error}
            code:
              type: string
              nullable: true
              description: e.g. invalid_api_key for authentication_error, invalid_request_error for invalid_request_error.
    HierarchyContext:
      type: object
      properties:
        agency_id: {type: string, nullable: true}
        client_id: {type: string, nullable: true}
        project_id: {type: string}
        master_company: {type: string}
        tenant_id: {type: string, nullable: true}
        user_id: {type: string, nullable: true, description: "Generic user identifier (alias for the user within the current scope)."}
        master_user_id: {type: string, nullable: true, description: "User ID within the masterCompany identity system."}
        tenant_user_id: {type: string, nullable: true, description: "User ID within the tenant identity system."}
        client_user_id: {type: string, nullable: true, description: "User ID within the client identity system."}
        project_user_id: {type: string, nullable: true, description: "User ID within the project identity system."}
        roles: {type: array, items: {type: string}}
        scope_type:
          type: string
          enum: [master, agency, client, project, user]
        scope_id: {type: string}
      required: [scope_type, scope_id, master_company, project_id]
    MeteringContext:
      type: object
      properties:
        caller_module: {type: string}
        operation_id: {type: string}
        request_purpose: {type: string}
        cost_accounting_required: {type: boolean}
        custom_dimensions:
          type: object
          additionalProperties: true
    AnthropicMessagesRequest:
      type: object
      properties:
        model: {type: string}
        messages: {type: array, items: {type: object}}
        max_tokens: {type: integer}
        stream: {type: boolean}
        system: {oneOf: [{type: string}, {type: array}]}
        shortAnswer:
          type: boolean
          description: When true, llmproxy injects a concise-answer instruction before forwarding the request upstream.
      required: [model, messages]
    AnthropicMessagesResponse:
      type: object
      properties:
        id: {type: string}
        type: {type: string, enum: [message]}
        role: {type: string, enum: [assistant]}
        model: {type: string}
        content: {type: array, items: {type: object}}
        stop_reason: {type: string, nullable: true}
        usage:
          type: object
          properties:
            input_tokens: {type: integer}
            output_tokens: {type: integer}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - PROVIDER_UNAVAILABLE
                - RATE_LIMIT
                - INVALID_MODEL
                - AUTH_REQUIRED
                - HIERARCHY_CONTEXT_REQUIRED
                - METERING_SINK_FAILED
                - NOT_AVAILABLE
                - INVALID_PARAM
                - METERING_READ_ERROR
            message: {type: string}
            trace_id: {type: string}
            provider_attempts: {type: array, items: {type: object}}
    CliCommandResponse:
      type: object
      required: [success, exitCode, command, data, timestamp]
      properties:
        success: {type: boolean}
        exitCode: {type: integer}
        command: {type: string}
        data:
          type: object
          properties:
            output: {type: string}
            error: {type: string}
        timestamp: {type: string, format: date-time}
    MeteringRecord:
      type: object
      description: |
        A single metering record emitted for each proxied inference request.
        All fields are nullable unless explicitly marked required.
      properties:
        event_schema_version: {type: string, example: "2026.1"}
        event_version: {type: integer, example: 1}
        idempotency_key: {type: string, nullable: true}
        timestamp: {type: string, format: date-time, description: "ISO 8601 UTC timestamp of when the request completed."}
        request_id: {type: string, nullable: true, description: "Proxy-generated unique request identifier (req_<16 hex chars>)."}
        trace_id: {type: string, nullable: true, description: "Caller-supplied X-Trace-Id, useful for correlating with upstream logs."}
        provider: {type: string, nullable: true, description: "Provider actually used (e.g. copilot, openai, anthropic)."}
        provider_attempts:
          type: array
          description: "Ordered list of provider attempts, including fallbacks."
          items:
            type: object
            properties:
              provider: {type: string}
              model: {type: string, nullable: true}
              success: {type: boolean}
              error_code: {type: string, nullable: true}
              duration_ms: {type: number, nullable: true}
        fallback_count: {type: integer, description: "Number of provider fallbacks that occurred (0 = first provider succeeded)."}
        model_requested: {type: string, nullable: true}
        model_used: {type: string, nullable: true}
        endpoint: {type: string, nullable: true, description: "Route path that received the request (e.g. /v1/llm/messages)."}
        duration_ms: {type: number, nullable: true, description: "Total wall-clock time in milliseconds from request receipt to response sent."}
        success: {type: boolean}
        error_code: {type: string, nullable: true}
        prompt_tokens: {type: integer, nullable: true}
        completion_tokens: {type: integer, nullable: true}
        total_tokens: {type: integer, nullable: true}
        tokens_input: {type: integer, nullable: true, description: "Alias for prompt_tokens (v10 column name)."}
        tokens_output: {type: integer, nullable: true, description: "Alias for completion_tokens (v10 column name)."}
        master_company: {type: string, nullable: true}
        tenant_id: {type: string, nullable: true}
        client_id: {type: string, nullable: true}
        project_id: {type: string, nullable: true}
        user_id: {type: string, nullable: true}
        scope_type: {type: string, nullable: true}
        scope_id: {type: string, nullable: true}
        master_user_id: {type: string, nullable: true}
        tenant_user_id: {type: string, nullable: true}
        client_user_id: {type: string, nullable: true}
        project_user_id: {type: string, nullable: true}
        company_id: {type: string, nullable: true, description: "Alias for master_company (v10 column name)."}
        caller_module: {type: string, nullable: true}
        operation_id: {type: string, nullable: true}
        request_purpose: {type: string, nullable: true}
        cost_accounting_required: {type: boolean}
        custom_dimensions: {type: object, nullable: true, additionalProperties: true}
        agent: {type: string, nullable: true}
        mansione: {type: string, nullable: true}
        task_id: {type: string, nullable: true}
        hierarchy_context: {type: object, nullable: true, description: "Full HierarchyContext object as parsed from the request header."}
        metering_context: {type: object, nullable: true, description: "Full MeteringContext object as parsed from the request header."}
    MeteringStats:
      type: object
      description: Aggregate statistics computed over a set of metering records.
      properties:
        filtered_total:
          type: integer
          description: Total number of records matching the applied filters.
        total_requests: {type: integer}
        success_count: {type: integer}
        error_count: {type: integer}
        total_tokens_input: {type: integer}
        total_tokens_output: {type: integer}
        total_tokens: {type: integer}
        avg_tokens_input: {type: integer, nullable: true, description: "Average input tokens per request. null if no records."}
        avg_tokens_output: {type: integer, nullable: true, description: "Average output tokens per request. null if no records."}
        avg_duration_ms: {type: number, nullable: true, description: "Mean latency across all records with a duration_ms value."}
        p50_duration_ms: {type: number, nullable: true, description: "50th-percentile (median) latency."}
        p95_duration_ms: {type: number, nullable: true, description: "95th-percentile latency."}
        earliest_timestamp: {type: string, format: date-time, nullable: true}
        latest_timestamp: {type: string, format: date-time, nullable: true}
        by_provider:
          type: object
          description: "Per-provider breakdown. Keys are provider names."
          additionalProperties:
            type: object
            properties:
              requests: {type: integer}
              tokens_input: {type: integer}
              tokens_output: {type: integer}
        by_scope_type:
          type: object
          description: "Per-scope_type breakdown."
          additionalProperties:
            type: object
            properties:
              requests: {type: integer}
              tokens_input: {type: integer}
              tokens_output: {type: integer}
        by_project_id:
          type: object
          description: "Per-project_id breakdown. Useful for per-project cost reporting."
          additionalProperties:
            type: object
            properties:
              requests: {type: integer}
              tokens_input: {type: integer}
              tokens_output: {type: integer}
    ModelObject:
      type: object
      required: [id, object, created, owned_by]
      properties:
        id: {type: string}
        object: {type: string, enum: [model]}
        created: {type: integer, description: "Unix timestamp (seconds) of catalog generation."}
        owned_by: {type: string}
paths:
  /health:
    get:
      tags: [runtime]
      summary: Liveness and authentication status (standalone).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  authenticated: {type: boolean}
  /auth/status:
    get:
      tags: [runtime]
      summary: Authentication status for Claude-compatible local clients.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: {type: boolean}
  /api/release-notes:
    get:
      tags: [control-plane]
      summary: Release notes for the current or requested llmProxy version.
      parameters:
        - in: query
          name: version
          schema: {type: string}
        - in: query
          name: locale
          schema: {type: string, enum: [it, en]}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/version:
    get:
      tags: [control-plane]
      summary: llmProxy version.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/help:
    get:
      tags: [control-plane]
      summary: CLI help text, optionally for one command.
      parameters:
        - in: query
          name: command
          schema: {type: string}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/setup:
    get:
      tags: [control-plane]
      summary: Prepare runtime directories and show the service manager.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/auth/login:
    post:
      tags: [control-plane]
      summary: Legacy login alias for the GitHub Copilot device flow.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/auth/logout:
    post:
      tags: [control-plane]
      summary: Remove the Copilot token and provider registry.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/service/status:
    get:
      tags: [control-plane]
      summary: Show service manager, runtime and active state.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/service/start:
    post:
      tags: [control-plane]
      summary: Install and start the persistent service.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/service/stop:
    post:
      tags: [control-plane]
      summary: Stop the persistent service.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/service/restart:
    post:
      tags: [control-plane]
      summary: Restart the persistent service.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/logs:
    get:
      tags: [control-plane]
      summary: Snapshot of the service logs (static tail).
      parameters:
        - in: query
          name: follow
          schema: {type: string, enum: ["true"]}
          description: Not supported; when true the endpoint returns 400 with an explicit message. Use /api/logs/stream (SSE) for live tailing.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
        "400":
          description: follow=true is not supported in polling JSON; use /api/logs/stream.
  /api/logs/stream:
    get:
      tags: [control-plane]
      summary: Live log streaming via Server-Sent Events.
      parameters:
        - in: query
          name: intervalMs
          schema: {type: integer, minimum: 200}
      responses:
        "200":
          description: SSE stream emitting ready and log events.
          content:
            text/event-stream:
              schema: {type: string}
  /api/models:
    get:
      tags: [control-plane]
      summary: List the configured providers and models.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/test:
    post:
      tags: [control-plane]
      summary: Probe the active provider reachability.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/claude/setup:
    post:
      tags: [control-plane]
      summary: Configure Claude Code to use llmProxy as local backend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectPath: {type: string}
                model: {type: string}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/pi/setup:
    post:
      tags: [control-plane]
      summary: Configure PI Agent to use llmProxy as its provider.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/vscode/chat/setup:
    post:
      tags: [control-plane]
      summary: Configure VS Code chat language models to use llmProxy.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/vscode/claude/setup:
    post:
      tags: [control-plane]
      summary: Configure Claude Code in VS Code to use llmProxy.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/model/set:
    post:
      tags: [control-plane]
      summary: Set the effective Claude model chain for a project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model: {type: string}
                projectPath: {type: string}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/service/runtime:
    post:
      tags: [control-plane]
      summary: Switch the managed runtime between docker and native service mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runtime]
              properties:
                runtime:
                  type: string
                  enum: [docker, native, launchd, systemd]
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/providers:
    get:
      tags: [control-plane]
      summary: List configured providers with fallback order (same as provider:list).
      parameters:
        - in: query
          name: projectPath
          schema: {type: string}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/providers/status:
    get:
      tags: [control-plane]
      summary: Show the active provider and a synthetic status summary.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/providers/available:
    get:
      tags: [control-plane]
      summary: List providers from the canonical provider catalog.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/providers/usage:
    get:
      tags: [control-plane]
      summary: Show token usage breakdown by provider and model.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/providers/{id}/login:
    post:
      tags: [control-plane]
      summary: Register a provider via OAuth device flow (Copilot login).
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/providers/{id}/api-key:
    post:
      tags: [control-plane]
      summary: Set an API-key credential for a known provider (non-Copilot).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: {type: string}
                name: {type: string}
                model: {type: string}
                vision: {type: boolean, default: true}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/providers/order:
    post:
      tags: [control-plane]
      summary: Move a provider to a new fallback position.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, position]
              properties:
                id: {type: string}
                position: {type: integer}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/providers/reorder:
    post:
      tags: [control-plane]
      summary: Force an immediate provider reordering cycle.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/providers/{id}/rename:
    post:
      tags: [control-plane]
      summary: Update the display name of a provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/providers/{id}:
    patch:
      tags: [control-plane]
      summary: Update provider metadata (vision, free_model, name).
      description: The body must use an explicit patch envelope; flat fields are rejected with 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patch]
              properties:
                patch:
                  type: object
                  properties:
                    vision: {type: boolean}
                    free_model: {type: boolean}
                    name: {type: string}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
        "400":
          description: Empty patch envelope (no fields to update).
    delete:
      tags: [control-plane]
      summary: Remove a configured provider.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
        "404":
          description: Provider not found (CLI-style payload with success=false, Provider non trovato).
  /api/stats:
    get:
      tags: [control-plane]
      summary: Show aggregate llmProxy usage statistics.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/config:
    get:
      tags: [control-plane]
      summary: List supported configuration values for project, global or service scope.
      description: Requires a resolvable project path (projectPath query or x-project-path header).
      parameters:
        - in: query
          name: scope
          schema: {type: string, enum: [project, global, service]}
        - in: query
          name: projectPath
          schema: {type: string}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
        "403":
          description: PROJECT_PATH_NOT_ALLOWED when no project path can be resolved.
  /api/config/{key}:
    get:
      tags: [control-plane]
      summary: Read one supported configuration key.
      description: Keys are scope-bound; service-scope keys (e.g. LLMPROXY_ENV, LLMPROXY_API_KEY) require scope=service, otherwise the API returns 400.
      parameters:
        - in: path
          name: key
          required: true
          schema: {type: string}
        - in: query
          name: scope
          schema: {type: string, enum: [project, global, service]}
        - in: query
          name: projectPath
          schema: {type: string}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
        "400":
          description: Missing/invalid scope for a scope-bound key.
        "403":
          description: PROJECT_PATH_NOT_ALLOWED when no project path can be resolved.
    post:
      tags: [control-plane]
      summary: Set one supported configuration key.
      description: Keys are scope-bound; restartRequired keys return restarting:true and schedule a service restart.
      parameters:
        - in: path
          name: key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: {type: string}
                scope: {type: string, enum: [project, global, service]}
                projectPath: {type: string}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
        "400":
          description: Unsupported key, invalid scope for the requested key, or missing project path.
        "403":
          description: PROJECT_PATH_NOT_ALLOWED when no project path can be resolved.
    delete:
      tags: [control-plane]
      summary: Unset one supported configuration key.
      parameters:
        - in: path
          name: key
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scope: {type: string, enum: [project, global, service]}
                projectPath: {type: string}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
        "400":
          description: Invalid scope for the requested key.
        "403":
          description: PROJECT_PATH_NOT_ALLOWED when no project path can be resolved.
  /api/update:
    post:
      tags: [control-plane]
      summary: Update the installed llmProxy runtime.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/uninstall:
    post:
      tags: [control-plane]
      summary: Remove the installed llmProxy runtime.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /v1/chat/completions:
    post:
      tags: [runtime]
      summary: OpenAI-compatible Chat Completions.
      description: |
        OpenAI-shaped endpoint for generic clients (opencode, OpenRouter/z.ai/Moonshot-style, LangChain).
        Request and response bodies, streaming chunks and errors follow the OpenAI shapes. The `model`
        id is qualified as `provider:model` (see `GET /v1/models`); a bare model id falls back to the
        normal provider/fallback order. Errors use the OpenAI envelope
        `{error: {message, type, code}}` (e.g. 401 → type `authentication_error`, code `invalid_api_key`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model:
                  type: string
                  description: Qualified model id `provider:model` (from GET /v1/models) or bare model id.
                messages:
                  type: array
                  description: OpenAI chat messages (system/user/assistant/tool roles are translated to the upstream protocol).
                  items: {type: object}
                stream:
                  type: boolean
                  default: false
                  description: "When true the response is an SSE stream of OpenAI chat.completion.chunk events ending with `data: [DONE]`."
                stream_options:
                  type: object
                  properties:
                    include_usage:
                      type: boolean
                      default: false
                      description: When true (with stream=true), a final chunk with choices:[] and usage is emitted right before [DONE].
                tools:
                  type: array
                  description: OpenAI tool definitions, translated to the upstream protocol (base tool_calls support).
                  items: {type: object}
                tool_choice:
                  description: OpenAI tool_choice (auto/required/function mapping).
      responses:
        "200":
          description: |
            Chat completion. With stream=true the content type is text/event-stream and the body is
            OpenAI chat.completion.chunk SSE events (first chunk carries delta {role:assistant}, text
            deltas carry delta {content}, thinking deltas carry delta {reasoning_content}, tool calls
            carry delta {tool_calls:[...]}, final chunk carries finish_reason stop/length/tool_calls,
            optional usage chunk with choices:[] when stream_options.include_usage=true, then data: [DONE]).
          content:
            application/json:
              schema:
                type: object
                description: OpenAI chat.completion object (model echoes the upstream model used).
            text/event-stream:
              schema:
                type: string
                description: "SSE stream of OpenAI chat.completion.chunk events, terminated by `data: [DONE]`."
        "400":
          description: Invalid request (OpenAI error envelope).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        "401":
          description: Provider authentication failure or missing inbound API key (OpenAI error envelope).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
  /v1/llm/chat/completions:
    post:
      tags: [platform]
      summary: Platform-facing alias for /v1/chat/completions.
      description: |
        Requires HierarchyContext in platform mode, like /v1/llm/messages. Requires platform mode
        (db-layer/event-bus reachable); not available in standalone mode.
      responses:
        "200":
          description: Chat completion (same shapes as /v1/chat/completions, streaming included).
        "400":
          description: HIERARCHY_CONTEXT_REQUIRED when the hierarchy context is missing or invalid.
  /v1/responses:
    post:
      tags: [runtime]
      summary: OpenAI-compatible Responses API.
      description: |
        OpenAI Responses-shaped endpoint for clients that speak the Responses protocol (Codex CLI >= 0.152,
        OpenAI Agents SDK). The request body uses Responses items (`input` array with `input_text` /
        `function_call` / `function_call_output` items, `instructions`, `max_output_tokens`, `tools`,
        `tool_choice`, `stream`). The response is a Responses object (`object: "response"`, `status:
        "completed"`, `output[]` with `message`/`function_call` items, `usage` with
        input_tokens/output_tokens/total_tokens). With `stream: true` the response is an SSE stream of
        Responses events (`response.created`, `response.output_item.added`, `response.output_text.delta`,
        `response.function_call_arguments.delta`, `response.completed`) terminated by `data: [DONE]`.
        Errors use the OpenAI envelope `{error: {message, type, code}}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model:
                  type: string
                  description: Qualified model id `provider:model` (from GET /v1/models) or bare model id.
                instructions:
                  type: string
                  description: System-level instructions, mapped to the upstream system prompt.
                input:
                  type: array
                  description: Responses input items (role-based messages with `input_text` content, `function_call`, `function_call_output`).
                  items: {type: object}
                max_output_tokens:
                  type: integer
                  description: Maximum output tokens, mapped to the upstream max_tokens.
                stream:
                  type: boolean
                  default: false
                  description: "When true the response is an SSE stream of Responses events ending with `data: [DONE]`."
                tools:
                  type: array
                  description: OpenAI tool definitions, translated to the upstream protocol.
                  items: {type: object}
                tool_choice:
                  description: OpenAI tool_choice (auto/required/function mapping).
      responses:
        "200":
          description: |
            Responses object. With stream=true the content type is text/event-stream and the body is
            Responses SSE events (response.created, response.output_item.added, response.output_text.delta,
            response.function_call_arguments.delta, response.completed) terminated by data: [DONE].
          content:
            application/json:
              schema:
                type: object
                description: OpenAI Responses object (model echoes the upstream model used).
            text/event-stream:
              schema:
                type: string
                description: "SSE stream of Responses events, terminated by `data: [DONE]`."
        "400":
          description: Invalid request (OpenAI error envelope).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
        "401":
          description: Provider authentication failure or missing inbound API key (OpenAI error envelope).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIErrorResponse'
  /v1/llm/responses:
    post:
      tags: [platform]
      summary: Platform-facing alias for /v1/responses.
      description: |
        Requires HierarchyContext in platform mode, like /v1/llm/messages. Requires platform mode
        (db-layer/event-bus reachable); not available in standalone mode.
      responses:
        "200":
          description: Responses object (same shapes as /v1/responses, streaming included).
        "400":
          description: HIERARCHY_CONTEXT_REQUIRED when the hierarchy context is missing or invalid.
  /v1/messages:
    post:
      tags: [runtime]
      summary: Anthropic-compatible Messages endpoint.
      description: |
        Primary runtime endpoint. Used by Claude Code in standalone mode. In platform mode
        the same endpoint accepts HierarchyContext and routes metering through the configured sink.
      parameters:
        - $ref: '#/components/parameters/HierarchyContextHeader'
        - $ref: '#/components/parameters/MeteringContextHeader'
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessagesRequest'
      responses:
        "200":
          description: Provider response translated to Anthropic format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessagesResponse'
            text/event-stream:
              schema:
                type: string
        "400": {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "401": {description: Auth required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "503": {description: All providers exhausted, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/llm/messages:
    post:
      tags: [platform]
      summary: Platform-facing alias of /v1/messages.
      description: |
        Functionally identical to /v1/messages but enforces HierarchyContext when the proxy is
        running in platform mode (`LLMPROXY_MODE=platform`).
      parameters:
        - $ref: '#/components/parameters/HierarchyContextHeader'
        - $ref: '#/components/parameters/MeteringContextHeader'
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessagesRequest'
      responses:
        "200":
          description: Provider response translated to Anthropic format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessagesResponse'
        "400": {description: HierarchyContext missing or invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/llm/providers:
    get:
      tags: [platform]
      summary: List the platform-facing provider registry (provider-registry.json).
      description: Separate registry from the local copilot-token.json credential store.
      parameters:
        - in: query
          name: scope_type
          schema: {type: string}
        - in: query
          name: scope_id
          schema: {type: string}
        - in: query
          name: provider
          schema: {type: string}
      responses:
        "200":
          description: Provider registry entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries: {type: array, items: {type: object}}
    post:
      tags: [platform]
      summary: Upsert a provider registry entry.
      description: In platform mode the HierarchyContext is required (400 HIERARCHY_CONTEXT_REQUIRED) and tenant ownership is enforced (403 AUTH_REQUIRED).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, scope_type, scope_id]
              properties:
                provider: {type: string}
                model: {type: string}
                api_key: {type: string}
                scope_type: {type: string}
                scope_id: {type: string}
      responses:
        "201":
          description: Entry upserted.
        "400":
          description: INVALID_SCOPE_TYPE or missing HierarchyContext.
        "403":
          description: AUTH_REQUIRED when the caller is not admin/owner.
  /v1/llm/providers/{id}:
    delete:
      tags: [platform]
      summary: Delete a provider registry entry.
      responses:
        "204":
          description: Entry removed.
        "404":
          description: NOT_FOUND when the entry does not exist.
  /v1/llm/health:
    get:
      tags: [platform]
      summary: Platform-facing health and capability descriptor.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  mode: {type: string, enum: [standalone, platform]}
                  authenticated: {type: boolean}
                  providers: {type: array, items: {type: string}}
                  manifest_version: {type: string}
  /v1/llm/metering:
    get:
      tags: [platform]
      summary: Query raw metering records.
      description: |
        Returns a paginated list of metering records emitted by the proxy since the sink was
        first activated. Each record describes a single inference request and contains:

        - **When**: `timestamp`, `duration_ms`
        - **Who**: full billing hierarchy (`master_company`, `tenant_id`, `client_id`, `project_id`,
          `scope_type`, `scope_id`) and per-level user IDs
          (`master_user_id`, `tenant_user_id`, `client_user_id`, `project_user_id`, `user_id`)
        - **What**: `model_requested`, `model_used`, `provider`, `endpoint`
        - **How many tokens**: `tokens_input`, `tokens_output` (and `prompt_tokens`,
          `completion_tokens` as aliases)
        - **Outcome**: `success`, `error_code`, `fallback_count`, `provider_attempts`
        - **Metering context**: `caller_module`, `operation_id`, `request_purpose`,
          `cost_accounting_required`, `custom_dimensions`, `agent`, `mansione`, `task_id`

        Only available when the proxy is running in platform mode (`LLMPROXY_MODE=platform`).
        The JSONL sink is activated automatically in platform mode.

        Records are stored in `~/Library/Application Support/llmProxy/logs/metering.jsonl`
        (macOS) or the platform-equivalent path. This endpoint reads from that file on every
        request — no in-memory cache.
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
          description: Maximum number of records to return.
        - in: query
          name: offset
          schema: {type: integer, minimum: 0, default: 0}
          description: Number of records to skip (for pagination).
        - in: query
          name: order
          schema: {type: string, enum: [desc, asc], default: desc}
          description: "`desc` returns the newest records first (default). `asc` returns oldest first."
        - in: query
          name: from
          schema: {type: string, format: date-time}
          description: Return only records with `timestamp >= from`. ISO 8601 string.
        - in: query
          name: to
          schema: {type: string, format: date-time}
          description: Return only records with `timestamp <= to`. ISO 8601 string.
        - in: query
          name: success
          schema: {type: string, enum: ["true", "false"]}
          description: Filter by request outcome.
        - in: query
          name: project_id
          schema: {type: string}
          description: Exact-match filter on `project_id`.
        - in: query
          name: tenant_id
          schema: {type: string}
          description: Exact-match filter on `tenant_id`.
        - in: query
          name: client_id
          schema: {type: string}
          description: Exact-match filter on `client_id`.
        - in: query
          name: master_company
          schema: {type: string}
          description: Exact-match filter on `master_company`.
        - in: query
          name: scope_type
          schema: {type: string, enum: [master, agency, client, project, user]}
          description: Exact-match filter on `scope_type`.
        - in: query
          name: scope_id
          schema: {type: string}
          description: Exact-match filter on `scope_id`.
        - in: query
          name: provider
          schema: {type: string}
          description: Exact-match filter on `provider`.
        - in: query
          name: user_id
          schema: {type: string}
          description: Exact-match filter on `user_id` (generic scope alias).
        - in: query
          name: master_user_id
          schema: {type: string}
          description: Exact-match filter on `master_user_id`.
        - in: query
          name: tenant_user_id
          schema: {type: string}
          description: Exact-match filter on `tenant_user_id`.
        - in: query
          name: client_user_id
          schema: {type: string}
          description: Exact-match filter on `client_user_id`.
        - in: query
          name: project_user_id
          schema: {type: string}
          description: Exact-match filter on `project_user_id`.
        - in: query
          name: request_id
          schema: {type: string}
          description: Exact-match filter on `request_id`.
      responses:
        "200":
          description: Paginated list of metering records.
          content:
            application/json:
              schema:
                type: object
                required: [records, total, limit, offset, order]
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/MeteringRecord'
                  total:
                    type: integer
                    description: Total number of records matching the applied filters (before pagination).
                  limit:
                    type: integer
                    description: Effective limit applied to this response.
                  offset:
                    type: integer
                    description: Effective offset applied to this response.
                  order:
                    type: string
                    enum: [desc, asc]
        "400": {description: Invalid query parameter, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "404": {description: Not available (proxy not in platform mode)}
        "500": {description: Failed to read metering JSONL file}
  /v1/llm/metering/stats:
    get:
      tags: [platform]
      summary: Aggregate statistics over metering records.
      description: |
        Computes aggregate statistics over the full set of records matching the supplied
        filters. Useful for dashboards, cost reporting, and capacity planning.

        Accepts the same filter parameters as `GET /v1/llm/metering`.
        Pagination parameters (`limit`, `offset`, `order`) are accepted but ignored —
        statistics are computed over the entire filtered set.

        Returned breakdowns (`by_provider`, `by_scope_type`, `by_project_id`) each contain
        per-key objects with `requests`, `tokens_input`, and `tokens_output`.

        Only available in platform mode.
      parameters:
        - in: query
          name: from
          schema: {type: string, format: date-time}
          description: Filter records with `timestamp >= from`.
        - in: query
          name: to
          schema: {type: string, format: date-time}
          description: Filter records with `timestamp <= to`.
        - in: query
          name: success
          schema: {type: string, enum: ["true", "false"]}
        - in: query
          name: project_id
          schema: {type: string}
        - in: query
          name: tenant_id
          schema: {type: string}
        - in: query
          name: client_id
          schema: {type: string}
        - in: query
          name: master_company
          schema: {type: string}
        - in: query
          name: scope_type
          schema: {type: string, enum: [master, agency, client, project, user]}
        - in: query
          name: scope_id
          schema: {type: string}
        - in: query
          name: provider
          schema: {type: string}
        - in: query
          name: master_user_id
          schema: {type: string}
        - in: query
          name: tenant_user_id
          schema: {type: string}
        - in: query
          name: client_user_id
          schema: {type: string}
        - in: query
          name: project_user_id
          schema: {type: string}
      responses:
        "200":
          description: Aggregate statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeteringStats'
        "400": {description: Invalid query parameter, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "404": {description: Not available (proxy not in platform mode)}
        "500": {description: Failed to read metering JSONL file}
  /v1/models:
    get:
      tags: [runtime]
      summary: List available models (OpenAI-compatible catalog).
      description: |
        Public endpoint (no authentication required), following the OpenAI convention that
        clients fetch the model catalog without credentials. Returns every configured provider
        default model, deduplicated by model id.
      responses:
        "200":
          description: Model catalog.
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: {type: string, enum: [list]}
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ModelObject'
  /v1/models/{modelId}:
    get:
      tags: [runtime]
      summary: Retrieve a single model by id (OpenAI-compatible lookup).
      parameters:
        - in: path
          name: modelId
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Model details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelObject'
        "404":
          description: Model not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message: {type: string}
