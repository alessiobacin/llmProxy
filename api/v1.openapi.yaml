openapi: 3.0.3
info:
  title: llmProxy API
  version: 0.2.2
  description: |
    Deterministic LLM transport tool (architecture v11, tool #45).

    Two control planes:
    - Standalone: default mode, configured and operated via the `llmproxy` CLI plus the local REST control plane.
      HierarchyContext is optional. `/v1/messages` is used directly by Claude Code.
    - Platform: opt-in compatibility mode, configured and operated via this HTTP API. HierarchyContext is required
      on platform endpoints. Metering records are emitted via the configured sink.

    llmProxy never runs LLM-driven logic. It transports requests, manages provider
    fallback, and produces deterministic audit and metering records.
servers:
  - url: http://127.0.0.1:5045
    description: Local standalone proxy (development)
  - url: http://127.0.0.1:6045
    description: Local standalone proxy (staging)
  - url: http://127.0.0.1:7045
    description: Local standalone proxy (production)
  - url: https://llmproxy.platform.local
    description: Platform deployment
tags:
  - name: runtime
    description: LLM transport runtime endpoints.
  - name: platform
    description: Platform-facing endpoints. Require HierarchyContext.
  - name: control-plane
    description: CLI-over-REST wrappers retained for backward compatibility.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    HierarchyContextHeader:
      in: header
      name: X-Hierarchy-Context
      required: false
      schema:
        type: string
        description: JSON-encoded HierarchyContext. Required in platform mode.
    MeteringContextHeader:
      in: header
      name: X-Metering-Context
      required: false
      schema:
        type: string
        description: JSON-encoded MeteringContext.
    TraceIdHeader:
      in: header
      name: X-Trace-Id
      required: false
      schema:
        type: string
  schemas:
    HierarchyContext:
      type: object
      properties:
        agency_id: {type: string, nullable: true}
        client_id: {type: string, nullable: true}
        project_id: {type: string}
        master_company: {type: string}
        tenant_id: {type: string, nullable: true}
        user_id: {type: string, nullable: true, description: "Generic user identifier (alias for the user within the current scope)."}
        master_user_id: {type: string, nullable: true, description: "User ID within the masterCompany identity system."}
        tenant_user_id: {type: string, nullable: true, description: "User ID within the tenant identity system."}
        client_user_id: {type: string, nullable: true, description: "User ID within the client identity system."}
        project_user_id: {type: string, nullable: true, description: "User ID within the project identity system."}
        roles: {type: array, items: {type: string}}
        scope_type:
          type: string
          enum: [master, agency, client, project, user]
        scope_id: {type: string}
      required: [scope_type, scope_id, master_company, project_id]
    MeteringContext:
      type: object
      properties:
        caller_module: {type: string}
        operation_id: {type: string}
        request_purpose: {type: string}
        cost_accounting_required: {type: boolean}
        custom_dimensions:
          type: object
          additionalProperties: true
    AnthropicMessagesRequest:
      type: object
      properties:
        model: {type: string}
        messages: {type: array, items: {type: object}}
        max_tokens: {type: integer}
        stream: {type: boolean}
        system: {oneOf: [{type: string}, {type: array}]}
        shortAnswer:
          type: boolean
          description: When true, llmproxy injects a concise-answer instruction before forwarding the request upstream.
      required: [model, messages]
    AnthropicMessagesResponse:
      type: object
      properties:
        id: {type: string}
        type: {type: string, enum: [message]}
        role: {type: string, enum: [assistant]}
        model: {type: string}
        content: {type: array, items: {type: object}}
        stop_reason: {type: string, nullable: true}
        usage:
          type: object
          properties:
            input_tokens: {type: integer}
            output_tokens: {type: integer}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - PROVIDER_UNAVAILABLE
                - RATE_LIMIT
                - INVALID_MODEL
                - AUTH_REQUIRED
                - HIERARCHY_CONTEXT_REQUIRED
                - METERING_SINK_FAILED
                - NOT_AVAILABLE
                - INVALID_PARAM
                - METERING_READ_ERROR
            message: {type: string}
            trace_id: {type: string}
            provider_attempts: {type: array, items: {type: object}}
    CliCommandResponse:
      type: object
      required: [success, exitCode, command, data, timestamp]
      properties:
        success: {type: boolean}
        exitCode: {type: integer}
        command: {type: string}
        data:
          type: object
          properties:
            output: {type: string}
            error: {type: string}
        timestamp: {type: string, format: date-time}
    MeteringRecord:
      type: object
      description: |
        A single metering record emitted for each proxied inference request.
        All fields are nullable unless explicitly marked required.
      properties:
        event_schema_version: {type: string, example: "2026.1"}
        event_version: {type: integer, example: 1}
        idempotency_key: {type: string, nullable: true}
        timestamp: {type: string, format: date-time, description: "ISO 8601 UTC timestamp of when the request completed."}
        request_id: {type: string, nullable: true, description: "Proxy-generated unique request identifier (req_<16 hex chars>)."}
        trace_id: {type: string, nullable: true, description: "Caller-supplied X-Trace-Id, useful for correlating with upstream logs."}
        provider: {type: string, nullable: true, description: "Provider actually used (e.g. copilot, openai, anthropic)."}
        provider_attempts:
          type: array
          description: "Ordered list of provider attempts, including fallbacks."
          items:
            type: object
            properties:
              provider: {type: string}
              model: {type: string, nullable: true}
              success: {type: boolean}
              error_code: {type: string, nullable: true}
              duration_ms: {type: number, nullable: true}
        fallback_count: {type: integer, description: "Number of provider fallbacks that occurred (0 = first provider succeeded)."}
        model_requested: {type: string, nullable: true}
        model_used: {type: string, nullable: true}
        endpoint: {type: string, nullable: true, description: "Route path that received the request (e.g. /v1/llm/messages)."}
        duration_ms: {type: number, nullable: true, description: "Total wall-clock time in milliseconds from request receipt to response sent."}
        success: {type: boolean}
        error_code: {type: string, nullable: true}
        prompt_tokens: {type: integer, nullable: true}
        completion_tokens: {type: integer, nullable: true}
        total_tokens: {type: integer, nullable: true}
        tokens_input: {type: integer, nullable: true, description: "Alias for prompt_tokens (v10 column name)."}
        tokens_output: {type: integer, nullable: true, description: "Alias for completion_tokens (v10 column name)."}
        master_company: {type: string, nullable: true}
        tenant_id: {type: string, nullable: true}
        client_id: {type: string, nullable: true}
        project_id: {type: string, nullable: true}
        user_id: {type: string, nullable: true}
        scope_type: {type: string, nullable: true}
        scope_id: {type: string, nullable: true}
        master_user_id: {type: string, nullable: true}
        tenant_user_id: {type: string, nullable: true}
        client_user_id: {type: string, nullable: true}
        project_user_id: {type: string, nullable: true}
        company_id: {type: string, nullable: true, description: "Alias for master_company (v10 column name)."}
        caller_module: {type: string, nullable: true}
        operation_id: {type: string, nullable: true}
        request_purpose: {type: string, nullable: true}
        cost_accounting_required: {type: boolean}
        custom_dimensions: {type: object, nullable: true, additionalProperties: true}
        agent: {type: string, nullable: true}
        mansione: {type: string, nullable: true}
        task_id: {type: string, nullable: true}
        hierarchy_context: {type: object, nullable: true, description: "Full HierarchyContext object as parsed from the request header."}
        metering_context: {type: object, nullable: true, description: "Full MeteringContext object as parsed from the request header."}
    MeteringStats:
      type: object
      description: Aggregate statistics computed over a set of metering records.
      properties:
        filtered_total:
          type: integer
          description: Total number of records matching the applied filters.
        total_requests: {type: integer}
        success_count: {type: integer}
        error_count: {type: integer}
        total_tokens_input: {type: integer}
        total_tokens_output: {type: integer}
        total_tokens: {type: integer}
        avg_tokens_input: {type: integer, nullable: true, description: "Average input tokens per request. null if no records."}
        avg_tokens_output: {type: integer, nullable: true, description: "Average output tokens per request. null if no records."}
        avg_duration_ms: {type: number, nullable: true, description: "Mean latency across all records with a duration_ms value."}
        p50_duration_ms: {type: number, nullable: true, description: "50th-percentile (median) latency."}
        p95_duration_ms: {type: number, nullable: true, description: "95th-percentile latency."}
        earliest_timestamp: {type: string, format: date-time, nullable: true}
        latest_timestamp: {type: string, format: date-time, nullable: true}
        by_provider:
          type: object
          description: "Per-provider breakdown. Keys are provider names."
          additionalProperties:
            type: object
            properties:
              requests: {type: integer}
              tokens_input: {type: integer}
              tokens_output: {type: integer}
        by_scope_type:
          type: object
          description: "Per-scope_type breakdown."
          additionalProperties:
            type: object
            properties:
              requests: {type: integer}
              tokens_input: {type: integer}
              tokens_output: {type: integer}
        by_project_id:
          type: object
          description: "Per-project_id breakdown. Useful for per-project cost reporting."
          additionalProperties:
            type: object
            properties:
              requests: {type: integer}
              tokens_input: {type: integer}
              tokens_output: {type: integer}
paths:
  /health:
    get:
      tags: [runtime]
      summary: Liveness and authentication status (standalone).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  authenticated: {type: boolean}
  /api/release-notes:
    get:
      tags: [control-plane]
      summary: Release notes for the current or requested llmProxy version.
      parameters:
        - in: query
          name: version
          schema: {type: string}
        - in: query
          name: locale
          schema: {type: string, enum: [it, en]}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/model/set:
    post:
      tags: [control-plane]
      summary: Set the effective Claude model chain for a project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model: {type: string}
                projectPath: {type: string}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/providers/available:
    get:
      tags: [control-plane]
      summary: List providers from the canonical provider catalog.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/providers/usage:
    get:
      tags: [control-plane]
      summary: Show token usage breakdown by provider and model.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/stats:
    get:
      tags: [control-plane]
      summary: Show aggregate llmProxy usage statistics.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/smart/add:
    post:
      tags: [control-plane]
      summary: Configure the SMART classifier provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, model, apiKey]
              properties:
                provider: {type: string}
                model: {type: string}
                apiKey: {type: string}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/smart/status:
    get:
      tags: [control-plane]
      summary: Show SMART router status.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/smart/test:
    post:
      tags: [control-plane]
      summary: Simulate SMART routing.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/smart/refresh:
    post:
      tags: [control-plane]
      summary: Refresh SMART availability cache.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/config:
    get:
      tags: [control-plane]
      summary: List supported configuration values for project or service scope.
      parameters:
        - in: query
          name: scope
          schema: {type: string, enum: [project, service]}
        - in: query
          name: projectPath
          schema: {type: string}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/config/{key}:
    get:
      tags: [control-plane]
      summary: Read one supported configuration key.
      parameters:
        - in: path
          name: key
          required: true
          schema: {type: string}
        - in: query
          name: scope
          schema: {type: string, enum: [project, service]}
        - in: query
          name: projectPath
          schema: {type: string}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
    post:
      tags: [control-plane]
      summary: Set one supported configuration key.
      parameters:
        - in: path
          name: key
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: {type: string}
                scope: {type: string, enum: [project, service]}
                projectPath: {type: string}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
        "400":
          description: Unsupported key or invalid scope for the requested key.
    delete:
      tags: [control-plane]
      summary: Unset one supported configuration key.
      parameters:
        - in: path
          name: key
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scope: {type: string, enum: [project, service]}
                projectPath: {type: string}
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/update:
    post:
      tags: [control-plane]
      summary: Update the installed llmProxy runtime.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /api/uninstall:
    post:
      tags: [control-plane]
      summary: Remove the installed llmProxy runtime.
      responses:
        "200":
          description: CLI-style command response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliCommandResponse'
  /v1/messages:
    post:
      tags: [runtime]
      summary: Anthropic-compatible Messages endpoint.
      description: |
        Primary runtime endpoint. Used by Claude Code in standalone mode. In platform mode
        the same endpoint accepts HierarchyContext and routes metering through the configured sink.
      parameters:
        - $ref: '#/components/parameters/HierarchyContextHeader'
        - $ref: '#/components/parameters/MeteringContextHeader'
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessagesRequest'
      responses:
        "200":
          description: Provider response translated to Anthropic format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessagesResponse'
            text/event-stream:
              schema:
                type: string
        "400": {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "401": {description: Auth required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "503": {description: All providers exhausted, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/llm/messages:
    post:
      tags: [platform]
      summary: Platform-facing alias of /v1/messages.
      description: |
        Functionally identical to /v1/messages but enforces HierarchyContext when the proxy is
        running in platform mode (`LLMPROXY_MODE=platform`).
      parameters:
        - $ref: '#/components/parameters/HierarchyContextHeader'
        - $ref: '#/components/parameters/MeteringContextHeader'
        - $ref: '#/components/parameters/TraceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessagesRequest'
      responses:
        "200":
          description: Provider response translated to Anthropic format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessagesResponse'
        "400": {description: HierarchyContext missing or invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /v1/llm/health:
    get:
      tags: [platform]
      summary: Platform-facing health and capability descriptor.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
                  mode: {type: string, enum: [standalone, platform]}
                  authenticated: {type: boolean}
                  providers: {type: array, items: {type: string}}
                  manifest_version: {type: string}
  /v1/llm/metering:
    get:
      tags: [platform]
      summary: Query raw metering records.
      description: |
        Returns a paginated list of metering records emitted by the proxy since the sink was
        first activated. Each record describes a single inference request and contains:

        - **When**: `timestamp`, `duration_ms`
        - **Who**: full billing hierarchy (`master_company`, `tenant_id`, `client_id`, `project_id`,
          `scope_type`, `scope_id`) and per-level user IDs
          (`master_user_id`, `tenant_user_id`, `client_user_id`, `project_user_id`, `user_id`)
        - **What**: `model_requested`, `model_used`, `provider`, `endpoint`
        - **How many tokens**: `tokens_input`, `tokens_output` (and `prompt_tokens`,
          `completion_tokens` as aliases)
        - **Outcome**: `success`, `error_code`, `fallback_count`, `provider_attempts`
        - **Metering context**: `caller_module`, `operation_id`, `request_purpose`,
          `cost_accounting_required`, `custom_dimensions`, `agent`, `mansione`, `task_id`

        Only available when the proxy is running in platform mode (`LLMPROXY_MODE=platform`).
        The JSONL sink is activated automatically in platform mode.

        Records are stored in `~/Library/Application Support/llmProxy/logs/metering.jsonl`
        (macOS) or the platform-equivalent path. This endpoint reads from that file on every
        request — no in-memory cache.
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
          description: Maximum number of records to return.
        - in: query
          name: offset
          schema: {type: integer, minimum: 0, default: 0}
          description: Number of records to skip (for pagination).
        - in: query
          name: order
          schema: {type: string, enum: [desc, asc], default: desc}
          description: "`desc` returns the newest records first (default). `asc` returns oldest first."
        - in: query
          name: from
          schema: {type: string, format: date-time}
          description: Return only records with `timestamp >= from`. ISO 8601 string.
        - in: query
          name: to
          schema: {type: string, format: date-time}
          description: Return only records with `timestamp <= to`. ISO 8601 string.
        - in: query
          name: success
          schema: {type: string, enum: ["true", "false"]}
          description: Filter by request outcome.
        - in: query
          name: project_id
          schema: {type: string}
          description: Exact-match filter on `project_id`.
        - in: query
          name: tenant_id
          schema: {type: string}
          description: Exact-match filter on `tenant_id`.
        - in: query
          name: client_id
          schema: {type: string}
          description: Exact-match filter on `client_id`.
        - in: query
          name: master_company
          schema: {type: string}
          description: Exact-match filter on `master_company`.
        - in: query
          name: scope_type
          schema: {type: string, enum: [master, agency, client, project, user]}
          description: Exact-match filter on `scope_type`.
        - in: query
          name: scope_id
          schema: {type: string}
          description: Exact-match filter on `scope_id`.
        - in: query
          name: provider
          schema: {type: string}
          description: Exact-match filter on `provider`.
        - in: query
          name: user_id
          schema: {type: string}
          description: Exact-match filter on `user_id` (generic scope alias).
        - in: query
          name: master_user_id
          schema: {type: string}
          description: Exact-match filter on `master_user_id`.
        - in: query
          name: tenant_user_id
          schema: {type: string}
          description: Exact-match filter on `tenant_user_id`.
        - in: query
          name: client_user_id
          schema: {type: string}
          description: Exact-match filter on `client_user_id`.
        - in: query
          name: project_user_id
          schema: {type: string}
          description: Exact-match filter on `project_user_id`.
        - in: query
          name: request_id
          schema: {type: string}
          description: Exact-match filter on `request_id`.
      responses:
        "200":
          description: Paginated list of metering records.
          content:
            application/json:
              schema:
                type: object
                required: [records, total, limit, offset, order]
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/MeteringRecord'
                  total:
                    type: integer
                    description: Total number of records matching the applied filters (before pagination).
                  limit:
                    type: integer
                    description: Effective limit applied to this response.
                  offset:
                    type: integer
                    description: Effective offset applied to this response.
                  order:
                    type: string
                    enum: [desc, asc]
        "400": {description: Invalid query parameter, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        "404": {description: Not available (proxy not in platform mode)}
        "500": {description: Failed to read metering JSONL file}
  /v1/llm/metering/stats:
    get:
      tags: [platform]
      summary: Aggregate statistics over metering records.
      description: |
        Computes aggregate statistics over the full set of records matching the supplied
        filters. Useful for dashboards, cost reporting, and capacity planning.

        Accepts the same filter parameters as `GET /v1/llm/metering`.
        Pagination parameters (`limit`, `offset`, `order`) are accepted but ignored —
        statistics are computed over the entire filtered set.

        Returned breakdowns (`by_provider`, `by_scope_type`, `by_project_id`) each contain
        per-key objects with `requests`, `tokens_input`, and `tokens_output`.

        Only available in platform mode.
      parameters:
        - in: query
          name: from
          schema: {type: string, format: date-time}
          description: Filter records with `timestamp >= from`.
        - in: query
          name: to
          schema: {type: string, format: date-time}
          description: Filter records with `timestamp <= to`.
        - in: query
          name: success
          schema: {type: string, enum: ["true", "false"]}
        - in: query
          name: project_id
          schema: {type: string}
        - in: query
          name: tenant_id
          schema: {type: string}
        - in: query
          name: client_id
          schema: {type: string}
        - in: query
          name: master_company
          schema: {type: string}
        - in: query
          name: scope_type
